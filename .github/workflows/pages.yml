name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you deploy any branch by hand from the Actions tab, to preview before merging.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a queued one supersedes the one in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Turn Pages on if it is not already
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      # `npm run build` typechecks first, so a type error fails the deploy
      # rather than shipping a broken page.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
